[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskcost"
version = "0.1.0"
description = "TaskCost AI: benchmark AI models by the cost of successfully completed enterprise tasks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "pypdf>=4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
taskcost = "taskcost.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
