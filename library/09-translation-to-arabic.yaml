id: translation-to-arabic
category: translation
description: Translate a bank customer notice from English into formal Modern Standard Arabic.
prompt: |
  Translate this bank notice into formal Modern Standard Arabic suitable for a customer letter.

  Dear customer,
  We would like to inform you that your credit card ending in 4821 will expire on 31 December 2026.
  A replacement card will be sent to your registered address within 10 working days. To avoid any
  interruption to your payments, please activate the new card through our mobile app as soon as it arrives.
  If you did not expect this card, please call us immediately on 19555.
grader:
  type: rubric
  criteria:
    - The response is in Arabic.
    - Conveys that the card ending in 4821 expires on 31 December 2026.
    - Conveys that a replacement card will be sent to the registered address within 10 working days.
    - Asks the customer to activate the new card through the mobile app.
    - Gives the phone number 19555 to call if the card was not expected.
    - Uses formal Modern Standard Arabic, not a dialect.
    - Adds no information that is not in the original.
reference: |
  عزيزي العميل،
  نود إعلامكم بأن بطاقتكم الائتمانية المنتهية بالأرقام 4821 ستنتهي صلاحيتها في 31 ديسمبر 2026.
  وسيتم إرسال بطاقة بديلة إلى عنوانكم المسجل لدينا خلال 10 أيام عمل. ولتجنب أي انقطاع في مدفوعاتكم،
  يرجى تفعيل البطاقة الجديدة من خلال تطبيقنا على الهاتف المحمول فور استلامها.
  وإذا لم تكونوا تتوقعون استلام هذه البطاقة، يرجى الاتصال بنا فوراً على الرقم 19555.
counterexamples:
  - |
    عزيزي العميل، بطاقتك اللي آخرها 4821 هتخلص يوم 31 ديسمبر 2026، وهنبعتلك واحدة جديدة على عنوانك خلال 10 أيام شغل.
    فعّلها من الأبلكيشن أول ما توصلك، ولو مش مستنيها كلمنا على 19555.
  - |
    عزيزي العميل، نود إعلامكم بأن بطاقتكم المنتهية بالأرقام 4821 ستنتهي صلاحيتها في 31 ديسمبر 2026.
    سيتم إرسال بطاقة بديلة إلى فرعكم خلال 30 يوماً، مع رسوم إصدار قدرها 100 جنيه.
